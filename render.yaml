# Render blueprint for the backend API. The frontend is deployed on Vercel.
services:
  - type: web
    name: luminestbc-api
    runtime: python
    rootDir: backend
    plan: free  # free instances sleep when idle; upgrade for the demo so hold expiry keeps running
    buildCommand: pip install -r requirements.txt
    # Exactly one worker: Socket.IO and the background jobs live in one process.
    startCommand: gunicorn -w 1 --threads 100 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      # Comma-separated, no trailing slashes: the Vercel URL, plus the custom domain once it's live,
      # e.g. https://luminestbc.vercel.app,https://luminestbc.tech,https://www.luminestbc.tech
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: SMS_NUDGE_ENABLED
        value: "false"
      - key: DEV_TOOLS_ENABLED
        value: "false"  # no /admin or simulators in production
      - key: TAG_BASE_URL
        value: https://luminestbc.tech
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
